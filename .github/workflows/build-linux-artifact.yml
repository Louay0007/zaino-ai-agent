name: Build Linux artifact

on:
  # Unsigned standalone installers for self-hosted downloads.
  # No signing secrets needed — artifacts upload here, then get
  # published to the VPS /downloads mirror.
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (linux only)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils libasound2-dev libpipewire-0.3-dev libgbm-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: SDK contract typecheck
        run: pnpm --filter @ccgui/plugin-sdk typecheck

      # Frontend suite is mid-migration (engine/model picker rewrites) and
      # red on main; artifact builds must not gate on it. Full suite runs
      # in the release pipeline's test job once green again.
      - name: Frontend tests (non-blocking)
        run: pnpm exec vitest run src
        continue-on-error: true

      - name: Rust test compilation
        run: cargo test --manifest-path src-tauri/Cargo.toml --tests --no-run

      - name: Disable updater signing for artifact build
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("src-tauri/tauri.conf.json")
          d = json.loads(p.read_text())
          d["bundle"]["createUpdaterArtifacts"] = False
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY

      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tauri build --no-bundle

      - name: Bundle AppImage
        run: pnpm exec tauri bundle --bundles appimage

      - name: Prune bundled Wayland libraries from AppImage
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl --fail --show-error --location \
            -o .tools/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  .tools/appimagetool" \
            | sha256sum --check
          chmod +x .tools/appimagetool
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)
          test -n "$APPIMAGE"
          node scripts/prune-appimage-wayland-libs.mjs \
            --appimage "$APPIMAGE" \
            --appimagetool "$PWD/.tools/appimagetool" \
            --arch x86_64

      - name: Bundle deb
        run: pnpm exec tauri bundle --bundles deb

      - name: Bundle RPM
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 25m \
              pnpm exec tauri bundle --bundles rpm; then
              exit 0
            fi
            echo "::warning::rpm bundling attempt $attempt failed; retrying"
          done
          echo "::error::rpm bundling failed after 3 attempts"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: zaino-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
